services:
  db:
    build: ./database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_PORT: 5432
      POSTGRES_DB: deutschland_sammeln
    volumes:
      - my-db-volume:/var/lib/postgres
    restart: always
    networks:
      - backend

  frontend:
    build: ./deutschland_sammeln_v3
    volumes:
      - /var/deutschland_sammeln_server/frontend/:/configs
    depends_on:
      - db
    networks:
      - backend
      - frontend

  backend:
    build: ./deutschland_sammeln_online_V3_backend
    volumes:
    - /var/deutschland_sammeln_server/backend/:/configs
    depends_on:
      - db
    networks:
      - backend
      - frontend 

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/certs
    depends_on:
      - certbot
      - frontend
    networks: 
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  backend:
  frontend:

volumes:
  my-db-volume:
  configs:
  certs:
  nginx.conf: