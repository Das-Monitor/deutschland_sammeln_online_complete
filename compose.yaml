services:
  db:
    build: ./database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_PORT: 5432
      POSTGRES_DB: deutschland_sammeln
    volumes:
      - my-db-volume:/var/lib/postgres
    restart: always
    networks:
      - backend

  frontend:
    build: ./deutschland_sammeln_v3
    volumes:
      - /home/david/servers/deutschland_sammeln_online_complete/deutschland_sammeln_v3/configs:/configs
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - backend
      - frontend

networks:
  backend:
  frontend:

volumes:
  my-db-volume:
  configs:
    external: true
