services:
  db:
    build: ./database#
    environment:
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD: docker
      - POSTGRES_PORT: 5432
      - POSTGRES_DB: deutschland_sammeln
    volumes:
      - my-db-volume:/var/lib/postgres
    restart: always
    networks:
      - db

  frontend:
    build: ./deutschland_sammeln_v3
    ports:
      - 80:80
    depends_on:
      - db
    networks:
      - db

networks:
  db:

volumes:
  my-db-volume:
