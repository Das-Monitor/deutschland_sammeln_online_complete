services:
  db:
    build: ./database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_PORT: 5432
      POSTGRES_DB: deutschland_sammeln
    volumes:
      - my-db-volume:/var/lib/postgres
    restart: always
    networks:
      - backend

  frontend:
    build: ./deutschland_sammeln_v3
    volumes:
      - /var/deutschland_sammeln_server/frontend/:/configs
    ports:
      - 8080:8080
    depends_on:
      - db
      - nginx
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/letsencrypt
    depends_on:
      - certbot

  certbot:
    image: certbot/certbot
    volumes:
      - ./certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  backend:
  frontend:

volumes:
  my-db-volume:
  configs:
