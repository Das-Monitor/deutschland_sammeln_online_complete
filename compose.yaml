services:
  db:
    build: ./database
    environment:
      POSTGRES_PASSWORD: "pgPassword"
    ports:
      - 5432:5432
    volumes:
      - my-db-volume:/var/lib/postgres

  frontend:
    build: ./deutschland_sammeln_v3
    ports:
      - 80:80
    depends_on:
      - db


volumes:
  my-db-volume: