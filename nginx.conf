worker_processes 1;

events { 
    worker_connections 1024; 
}

http {

    sendfile on;
    large_client_header_buffers 4 32k;

    server {
        listen 80;
        listen 8080;
        server_name servers.neumann.ovh;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name servers.neumann.ovh;

        ssl_certificate /certs/live/servers.neumann.ovh/fullchain.pem;
        ssl_certificate_key /certs/live/servers.neumann.ovh/privkey.pem;

        location / {
            proxy_pass http://frontend:8080;  # Change this to your backend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}