stream {
    server {
        listen 443 ssl;
        server_name servers.neumann.ovh;  # Change this to your domain name

        ssl_certificate /etc/letsencrypt/live/servers.neumann.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/servers.neumann.ovh/privkey.pem;

        location / {
            proxy_pass http://127.0.0.1:8080;  # Change this to your backend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

stream {
    server {
        listen 80;
        server_name servers.neumann.ovh;  # Change this to your domain name

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
}