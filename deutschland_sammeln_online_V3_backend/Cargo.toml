[package]
name = "deutschland_sammeln_online_V3_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.9.2"
rocket = { version = "0.5.1", features = ["json"] }
serde = "1.0.219"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1.46.1" }
toml = "0.9.2"
